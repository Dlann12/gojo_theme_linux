gui:
  nerdFontsVersion: "3"
  border: rounded
  theme:
    activeBorderColor:
      - "#c084fc"
      - bold
    inactiveBorderColor:
      - "#475569"
    selectedLineBgColor:
      - "#2e1f4d"
    cherryPickedCommitBgColor:
      - "#38bdf8"
    optionsTextColor:
      - "#38bdf8"
git:
  pagers:
    - colorArg: always
      pager: delta --dark --paging=never --line-numbers --side-by-side
